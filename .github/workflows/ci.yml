name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run linters
        run: |
          flake8 . --config=.flake8
          black --check .
      - name: Run migrations check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/orders
          TELEGRAM_TOKEN: fake
          SECRET_KEY: fake
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/orders
          TELEGRAM_TOKEN: fake_token_for_ci
          SECRET_KEY: fake_secret_key_for_ci
        run: pytest tests/ -v