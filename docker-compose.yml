services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/orders}
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grpc-server:
    build: .
    command: ["python", "-m", "services.order_processor.app.server"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/orders}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-fake_token_for_ci}
      SECRET_KEY: ${SECRET_KEY:-fake_secret_key_for_ci}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fastapi:
    build: .
    command: ["uvicorn", "services.gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/orders}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-fake_token_for_ci}
      SECRET_KEY: ${SECRET_KEY:-fake_secret_key_for_ci}
      GRPC_SERVER_HOST: ${GRPC_SERVER_HOST:-grpc-server}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-50051}
    ports:
      - "8000:8000"
    depends_on:
      grpc-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notifier:
    build: .
    command: ["python", "-m", "services.notifier.app.consumer"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/orders}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-fake_token_for_ci}
      SECRET_KEY: ${SECRET_KEY:-fake_secret_key_for_ci}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data: